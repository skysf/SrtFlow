# 每个 PR（以及合并进 main 后）跑全部自检：scripts/check-all.sh。
# main 禁直推、必须走 PR —— 在这个闸口挂检查，「合并前必绿」就不靠自觉了。
#
# vendor/ffmpeg 不入库（见 .gitignore），按 vendor-ffmpeg.sh 的内容做缓存键：
# 脚本没变（上游 URL/校验值没变）就复用缓存，变了才重新下载。
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-all:
    # 必须 macos-26：字幕生成用了 macOS 26 的 SpeechAnalyzer API，
    # macos-15 镜像默认 Xcode 16（SDK 15）编不过完整 app target ——
    # 首跑 6 项齐红就是它（SrtFlowCore 不碰这些 API 所以核心检查过了）。
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions (diagnostics)
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Cache vendor/ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ffmpeg-${{ hashFiles('scripts/vendor-ffmpeg.sh') }}

      - name: Fetch ffmpeg (on cache miss)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/vendor-ffmpeg.sh

      # 单独一步冷编译：编译错误在自己的步骤里完整可见，
      # 也给后面的 check-all 暖好构建缓存。
      - name: Build (cold compile, errors visible here)
        run: swift build --arch arm64

      - name: Run all checks
        run: scripts/check-all.sh
